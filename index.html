<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanIT AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="./js/main.js" defer> </script>
   
</head>
<body class="bg-[#F1F5F9]">
    <header class=" flex justify-between bg-[#1C2541] p-auto">
        <img class="w-24 h-24 object-cover rounded-2xl m-3" src="./images/logo.jpg" alt="logo">
        <nav class=" flex items-center text-xl font-bold text-[#5BC0DE] gap-15"> 
            <a href="index.html">Dashboard</a>
            <a href="NvProjet.html"> Nouveau projet</a>
        </nav>  
        <button type="button" id="PaAI" class="font-bold text-xl text-[#5BC0DE] bg-[#3A506B] rounded-xl p-2 m-8 cursor-pointer transition duration-200 hover:shadow-lg"> Paramètres IA</button>

    </header>
    <main>
        <section class="">
            <h1 class=" flex font-bold text-xl text-[#1C2541] p-10"> Votre projes :</h1>
            <div class="flex justify-center">
            <div class="flex justify-center  w-[40%] border-2 border-dashed border-[#3A506B]">
                <a href="./NvProjet.html"><button class="font-bold text-xl text-[#5BC0DE] bg-[#3A506B] rounded-xl p-2 m-8 cursor-pointer transition duration-200 hover:shadow-lg">+ Ajouter un nouveau projet</button></a>
            </div>
            </div>
            <dialog  id="modal" class="m-auto w-[90%] max-w-md rounded-2xl bg-[#F1F5F9] p-0 shadow-2xl backdrop:bg-[#1C2541]/60">
                <form id="form" class="flex flex-col gap-5 p-8">
                <label class="flex flex-col gap-2 font-bold text-[#1C2541]">Votre cle API : <input type="text" id="input" required class="rounded-xl border-2 border-[#3A506B] bg-white p-2 font-normal text-[#1C2541] focus:border-[#5BC0DE] focus:outline-none"></label>
                <button type="submit" id="validation" class="font-bold text-[#5BC0DE] bg-[#3A506B] rounded-xl p-2 cursor-pointer transition duration-200 hover:shadow-lg">Valider</button>
                <button type="button" id="closeModal" class="font-bold text-[#3A506B] bg-white border-2 border-[#3A506B] rounded-xl p-2 cursor-pointer transition duration-200 hover:shadow-lg">Fermer</button>
                <button type="button" id="demo" class="font-bold text-[#1C2541] bg-[#5BC0DE] rounded-xl p-2 cursor-pointer transition duration-200 hover:shadow-lg">Mode démo</button>

                </form>
            </dialog>

        </section>
    </main>
</body>
</html>
